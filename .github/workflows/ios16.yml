name: Build iOS16

on:
  push:
    branches: [iOS16]
  workflow_dispatch:

jobs:
  build:
    # 按官方镜像列表选定 macos-15（Arm64，Xcode 16.x）。
    # 不用 macos-latest（当前指向 macos-26，工具链太新且仍是 Beta）。
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout iOS16
        uses: actions/checkout@v4
        with:
          ref: iOS16
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install llvm cmake ninja unifdef dtc mtools p7zip
          # BUILDING.md 明确要求让 Homebrew LLVM 可用（lld-link 来自这里）
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          python3 --version
          xcodebuild -version
          xcrun --find clang
          command -v lld-link || true
          xcrun --sdk iphoneos --show-sdk-path || true

      # ---------- 诊断：把这段日志发我，就能一次性把所有路径写死 ----------
      - name: Diagnostic — repo layout
        run: |
          echo "===== top-level ====="
          ls -la
          echo "===== tools/ ====="
          ls -la tools/ 2>/dev/null || echo "tools/ missing"
          echo "===== source/ ====="
          ls -la source/ 2>/dev/null || echo "source/ missing"
          echo "===== build-xnu-macos.py --help ====="
          python3 tools/build-xnu-macos.py --help 2>&1 || true
          echo "===== xnu-deps candidates ====="
          for p in xnu-deps source/hackios-xnu-kernel/xnu-deps; do
            if [ -d "$p" ]; then
              echo "--- $p ---"
              ls -la "$p"
              [ -f "$p/setup.sh" ] && echo "  setup.sh: yes"
            fi
          done
          echo "===== XNU source candidates ====="
          ls -d source/xnu-* source/hackios-xnu-kernel/xnu-* 2>/dev/null || echo "no candidate"
          echo "===== loader source ====="
          ls -la source/touch-runtime-v15/ 2>/dev/null || echo "touch-runtime-v15 missing"

      # ---------- UEFI Loader（BUILDING.md 第 3 节） ----------
      - name: Build UEFI Loader (RAM-only)
        run: |
          LOADER_SRC=source/touch-runtime-v15
          if [ ! -d "$LOADER_SRC" ]; then
            echo "!!! $LOADER_SRC 不存在"; exit 1
          fi
          mkdir -p build/loader-source
          git archive HEAD "$LOADER_SRC" | tar -x -C build/loader-source
          RAM_ONLY=1 LOADER_PLATFORM=dodge EMBEDDED_USB=1 \
            bash "build/loader-source/$LOADER_SRC/build.sh"
          test -f "build/loader-source/$LOADER_SRC/loader.efi" \
            && echo "loader.efi OK" \
            || { echo "loader.efi missing"; exit 1; }

      # ---------- XNU deps（BUILDING.md 第 4 节提到的 setup.sh） ----------
      - name: XNU dependencies (setup.sh)
        run: |
          if [ -f "source/hackios-xnu-kernel/xnu-deps/setup.sh" ]; then
            echo "using source/hackios-xnu-kernel/xnu-deps/setup.sh"
            bash source/hackios-xnu-kernel/xnu-deps/setup.sh
          elif [ -f "xnu-deps/setup.sh" ]; then
            echo "using xnu-deps/setup.sh"
            bash xnu-deps/setup.sh
          else
            echo "!!! setup.sh 未找到，后续内核构建可能因缺依赖失败"
          fi

      # ---------- 内核（BUILDING.md 第 4 节 export / libs / build） ----------
      - name: Build Kernel (XNU)
        run: |
          # 自动探测 XNU 源码目录（含 bsd/sys/param.h 的那个）
          SOURCE_DIR=""
          for d in source/xnu-build-snapshot/xnu-* source/hackios-xnu-kernel/xnu-* source/xnu-*; do
            if [ -d "$d" ] && [ -f "$d/bsd/sys/param.h" ]; then
              SOURCE_DIR="$PWD/$d"; break
            fi
          done
          [ -z "$SOURCE_DIR" ] && { echo "!!! 找不到 XNU 源码目录"; ls -la source/ 2>/dev/null; exit 1; }
          echo "SOURCE_DIR = $SOURCE_DIR"

          DEPS_DIR=""
          for d in xnu-deps source/hackios-xnu-kernel/xnu-deps; do
            if [ -d "$d" ]; then DEPS_DIR="$PWD/$d"; break; fi
          done
          echo "DEPS_DIR = $DEPS_DIR"

          WORK_DIR="$PWD/build/ios16-xnu"
          for action in export libs build; do
            echo "===== build-xnu-macos.py $action ====="
            python3 tools/build-xnu-macos.py "$action" \
              --source "$SOURCE_DIR" \
              --work "$WORK_DIR" \
              --deps "$DEPS_DIR" \
              -j 4 || exit 1
          done

          echo "===== kernel artifacts in WORK_DIR ====="
          find "$WORK_DIR" \( -name "mach.*" -o -name "kernel*" \) 2>/dev/null | head -30

      # ---------- 亮度助手（BUILDING.md 第 4 节，可选） ----------
      - name: Brightness userland helpers (optional)
        continue-on-error: true
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK = $SDK"
          python3 tools/build-op13-brightness-userland.py \
            --sdk "$SDK" \
            --output build/screen-brightness

      # ---------- 收集产物 ----------
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "build/loader-source/source/touch-runtime-v15/loader.efi" dist/ 2>/dev/null || true
          find build/ios16-xnu \( -name "mach.*" -o -name "kernel*" \) -exec cp {} dist/ \; 2>/dev/null || true
          cp -r build/screen-brightness dist/ 2>/dev/null || true
          echo "===== dist 内容 ====="
          ls -la dist/

      # ---------- 加密打包（key0） ----------
      - name: Encrypt package
        if: always()
        env:
          PACKAGE_KEY: ${{ secrets.key0 }}
        run: |
          if [ -z "$PACKAGE_KEY" ]; then
            echo "!!! secrets.key0 未设置"; exit 1
          fi
          7z a -t7z -mhe=on -p"$PACKAGE_KEY" ios16-build.7z ./dist
          ls -la ios16-build.7z

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios16-encrypted-build
          path: ios16-build.7z
