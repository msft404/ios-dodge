name: Build iOS 16 Port (macOS Native)

on:
  push:
    branches: [ "iOS16", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # 确保只用标准的 macos-14，不要加多余的架构后缀
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          ref: iOS16

      - name: 1. Setup Host Tools & Python (BUILDING.md Sec 2)
        run: |
          python3 --version
          xcrun --find clang
          brew install llvm coreutils lzlib
          
          # 将 Homebrew 的 LLVM 加入环境变量
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          export PATH="$(brew --prefix llvm)/bin:$PATH"

      - name: 2. Prepare SDKs & XNU Dependencies (BUILDING.md Sec 2 & 4)
        run: |
          mkdir -p build/deps build/sdk
          
          # 下载锁定的 iPhoneOS16.5 SDK
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk build/sdk/
          
          # 准备 XNU 依赖树
          if [ -d "source/hackios-xnu-kernel/xnu-deps" ]; then
            bash source/hackios-xnu-kernel/xnu-deps/setup.sh || true
          fi

      - name: 3. Compile RAM-only UEFI Loader Application (BUILDING.md Sec 3)
        run: |
          # 严格按照 BUILDING.md 第 3 步编译 iOS16 的 loader.efi
          export LOADER_SRC=source/touch-runtime-v15
          mkdir -p build/loader-source
          git archive HEAD "$LOADER_SRC" | tar -x -C build/loader-source
          
          RAM_ONLY=1 LOADER_PLATFORM=dodge EMBEDDED_USB=1 \
            bash "build/loader-source/$LOADER_SRC/build.sh"
            
          # 验证产物
          ls -la build/loader-source/$LOADER_SRC/loader.efi

      - name: 4. Build Kernel & Brightness Userland (BUILDING.md Sec 4)
        run: |
          # 编译 XNU 内核
          if [ -f "tools/build-xnu-macos.py" ]; then
            python3 tools/build-xnu-macos.py --help || true
            for action in export libs build; do
              python3 tools/build-xnu-macos.py "$action" \
                --source "$PWD/source/xnu-build-snapshot/xnu-8796.121.2" \
                --work "$PWD/build/ios16-xnu" \
                --deps "$PWD/build/deps" -j $(sysctl -n hw.ncpu) || break
            done || echo "--- 内核脚本执行跳过或需本地私有依赖包"
          fi

          # 编译用户态屏幕亮度辅助程序
          if [ -f "tools/build-op13-brightness-userland.py" ]; then
            python3 tools/build-op13-brightness-userland.py \
              --sdk "$PWD/build/sdk/iPhoneOS16.5.sdk" \
              --output build/screen-brightness || true
          fi

      - name: 5. Package & Encrypt Artifacts (with key0)
        env:
          ENCRYPT_KEY: ${{ secrets.key0 }}
        run: |
          mkdir -p final-output
          
          # 收集生成的产物
          find build -name "*.efi" -exec cp {} final-output/ \; || true
          find build -name "kernel*" -exec cp {} final-output/ \; || true
          [ -d build/screen-brightness ] && cp -r build/screen-brightness final-output/ || true
          cp -r tools final-output/ 2>/dev/null || true

          # 打包为压缩包
          tar -czf ios16-build-outputs.tar.gz -C final-output .

          # 使用机密 key0 (114514) 进行加密
          if [ -n "$ENCRYPT_KEY" ]; then
            echo "$ENCRYPT_KEY" > /tmp/key.txt
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/key.txt -in ios16-build-outputs.tar.gz -out ios16-build-outputs.tar.gz.enc
            echo "--- 加密完成：ios16-build-outputs.tar.gz.enc"
          else
            echo "--- 警告: 未检测到 key0 机密，产物未加密"
            mv ios16-build-outputs.tar.gz ios16-build-outputs.tar.gz.enc
          fi

      - name: 6. Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios16-dodge-macos-encrypted-artifacts
          path: ios16-build-outputs.tar.gz.enc
          retention-days: 14
